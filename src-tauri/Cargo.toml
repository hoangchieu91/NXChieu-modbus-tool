[package]
name = "nxchieu-modbus-tool"
version = "0.1.0"
description = "Industrial Cross-Platform Modbus Master Diagnostic Tool"
authors = ["NXChieu"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.43", features = ["full"] }
tokio-modbus = "0.17"
tokio-serial = "5.5"
serialport = "4.10"
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
